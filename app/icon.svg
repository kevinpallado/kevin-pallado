<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <style>
    .plate { fill: #ede4d3; }
    .mark { fill: #1d1f1b; }
    .ring { fill: #2a2421; stroke: #7b1e2e; stroke-width: 7; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #cbd0c4; }
      .mark { fill: #16181a; }
    }
  </style>
  <rect class="plate" width="180" height="180" rx="37" />
  <!-- The brand lockup: tight "KP" with the jack that replaces the period. -->
  <text
    class="mark"
    x="24"
    y="90"
    dominant-baseline="central"
    font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="88"
    font-weight="700"
    letter-spacing="-6"
  >KP</text>
  <!-- A port, not a dot: burgundy ferrule around a dark barrel. -->
  <circle class="ring" cx="139" cy="120" r="15" />
</svg>
