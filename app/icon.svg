<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <style>
    .plate { fill: #1e2022; }
    .mark { fill: #eef0ec; }
    .ring { fill: #121415; stroke: #b08d3f; stroke-width: 7; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #dde0da; }
      .mark { fill: #16181a; }
    }
  </style>
  <rect class="plate" width="180" height="180" rx="37" />
  <!-- The brand lockup: tight "KP" with the jack that replaces the period. -->
  <text
    class="mark"
    x="24"
    y="90"
    dominant-baseline="central"
    font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="88"
    font-weight="700"
    letter-spacing="-6"
  >KP</text>
  <!-- A port, not a dot: brass ferrule around a dark barrel, as on the bay. -->
  <circle class="ring" cx="139" cy="120" r="15" />
</svg>
